server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:9991/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /message {
        proxy_pass http://api:9991/message;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /Print-Designer/ {
        proxy_pass http://api:9991/Print-Designer/;
    }

    location /Upload/ {
        proxy_pass http://api:9991/Upload/;
    }

    location /Download/ {
        proxy_pass http://api:9991/Download/;
    }

    location /Static/ {
        proxy_pass http://api:9991/Static/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
